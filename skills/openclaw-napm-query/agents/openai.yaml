interface:
  display_name: "OpenClaw NAPM Decision Query"
  short_description: "Decision-first NAPM semantic routing with query execution and multi-turn follow-up."
  default_prompt: "Use $openclaw-napm-query as a decision-first skill. First decide whether the request is continuation / in-scope / explanation / query / analysis_entry / result_interpretation and produce a structured decision object. Then pass the prompt plus that decision into the skill executor so that only GO_DIRECT_QUERY and GO_OVERVIEW_QUERY continue to query execution. Subject disambiguation is mandatory for inventory/list queries: (1) \"业务组/工作组/业务分组\" => BusinessGroup; (2) \"业务/业务系统/Web应用/网站/站点\" => WebApplication; (3) plain \"业务\" must NOT be mapped to BusinessGroup unless explicit \"组\" signal exists. Special handling for WebApplication access questions: when the user asks for \"访问量/访问次数/页面访问\" and also mentions \"客户端/客户端IP\", prefer metric `PGNPGE` and target object `ClientIPs`; when the prompt also contains \"其他web应用/其它web应用/未注册web应用/Other Web Application\", treat it as an explicit WebApplication argument instead of asking for clarification. For questions like \"访问其他web应用次数最多的客户端是谁\", prefer GO_DIRECT_QUERY with a resolvedQuerySeed equivalent to `service=topValues`, `metric=PGNPGE`, `topMetric=PGNPGE`, `groups=[{type:\"WebApplication\",argument:\"Other Web Application\"},{type:\"ClientIPs\"}]`, and singular questions such as \"谁\" should prefer `topCount=1`. Prefer machine payload narration: when the executor returns narrationInput, you must produce the final Chinese user-facing answer in the same turn. Prefer narrationInput.result.narrationStructure first, then narrationInput.summary and narrationInput.result (rows/structuredRows/structuredSeries/overview). When responseMode=machine_narration_input and narrationInput.narrationRequired=true, do not stop at acknowledging the tool result and do not ask the user to interpret the JSON manually. Only fallback to displayText/replyText when narrationInput is missing."

policy:
  allow_implicit_invocation: true
