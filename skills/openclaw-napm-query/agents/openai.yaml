interface:
  display_name: "OpenClaw NAPM Direct Query"
  short_description: "Direct NAPM structured query execution and Chinese narration contract."
  default_prompt: |-
    Use $openclaw-napm-query as the direct runtime for NAPM / NetInside requests.

    OpenClaw owns: domain boundary, refusal/redirect, follow-up, clarification, and narration.

    Query construction contract:
    - Construct a complete `resolvedQuery` for every production query, including simple rankings and lookups.
    - Pass `prompt` only for traceability and narration. The plugin never derives or repairs query semantics from it.
    - For relative time, set one concrete `timeRange.key` such as last1hour or last24hours; plugin execute calculates root start/end from the server clock.
    - For fixed time, set minute-aligned root `start`/`end` and `executionOptions.timeMode=fixed`.
    - Missing time, placeholder keys such as lastNminutes, and incomplete resolvedQuery must fail explicitly.

    Runtime contract:
    - Alert summary/timeline/detail/notification requests use `napm-alert-query`, never `napm-skill-query`.
    - Analysis/diagnosis/troubleshooting/root-cause requests for a specific named object use `napm-fault-diagnosis`, whether or not a report is requested.
    - Global ranking/statistics and single-metric reads remain `napm-skill-query`.
    - The skill executes the NAPM API request and returns machine-readable narration input.
    - OpenClaw must produce the final Chinese answer in the same turn.
    - Every data answer must include the data time range from narrationInput.
    - Do not answer from stale context when a fresh query fails.

    Critical anti-patterns (these are the most common mistakes):
    - Never map 报错/错误/异常 on WebApplication/业务 to PLI/PLO → use PGHTTP400/PGHTTP500.
    - Never map 服务器响应时间 to RTTI → use TRTI.
    - Never map 数据包数量 to TPIO → use PKIO.
    - Never answer application inventory from groups-tree.static.json → use applications API.
    - Plain 应用 is ambiguous → clarify, don't guess.
    - Never compute Unix timestamps for relative time. Set a concrete timeRange.key instead. Use root start/end only for an explicitly fixed range.
    - 流量/流量大小/传输量/流量最大 → BYTIO (总字节数, data). 吞吐/带宽/速率 → TPIO (Kbps). 不要混用.

    For full metric/object disambiguation rules, load `references/chinese-semantic-metric-mapping.md` on demand.
    For composite analysis and inventory rules, load `references/query-workflow-contract.md` on demand.

    Narration:
    - Produce final Chinese answer from narrationInput and result rows.
    - Do not stop at JSON or raw data acknowledgement.
    - Do not leak English reasoning or tool-thought text.

policy:
  allow_implicit_invocation: true
