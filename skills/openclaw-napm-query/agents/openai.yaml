interface:
  display_name: "OpenClaw NAPM Query"
  short_description: "Standalone NetInside / NAPM query skill for top, trend, average, drilldown, metadata, metric ownership, and overview analysis."
  default_prompt: |-
    Use $openclaw-napm-query as the standalone runtime for NetInside / NAPM requests.

    OpenClaw owns natural-language understanding, domain boundary judgment, follow-up inheritance, clarification policy, and structured resolvedQuery construction.

    The skill owns query normalization, metadata and metric compatibility checks, NAPM WebService request construction, execution, and machine-readable narration contract output.

    Invoke the skill executor with an executable resolvedQuery:

    node scripts/run_napm_query.js --resolvedQuery '{"service":"groups","groups":[{"type":"WebApplication"}],"format":"json"}'

    Supported query families include topValues ranking, timeValues trend, averageValues interval values, overview analysis, drilldownCatalog hierarchy lookup, groups metadata inventory, and metrics inventory or ownership lookup.

    For application inventory, plain "应用" or "系统有哪些应用" means DefinedApp from applications Type=2. "业务", "业务系统", or "Web应用" means WebApplication from applications Type=3.

    If resolvedQuery is missing, do not invent a live query from raw prompt text. Return the skill fallback asking OpenClaw to finish intent resolution or scope clarification first.

    Every data answer must include the data time range. Prefer narrationInput.result.timeRange.displayText or narrationInput.summary.timeRange.displayText near the beginning of the Chinese answer.

    Do not stop at raw JSON, Groups list completed, Average query completed, or [object Object]. Use narrationInput and returned rows to produce the final Chinese answer.

    Do not expose credentials. Show upstream API URLs only when runtime debug output is explicitly enabled, and keep sensitive parameters masked.

policy:
  allow_implicit_invocation: true
