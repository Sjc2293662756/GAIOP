interface:
  display_name: "OpenClaw NAPM Alert Query"
  short_description: "Read-only NetInside alert event query, detail, timeline, trigger metric series, notification explanation, packet handoff, and reportData contract."
  default_prompt: |-
    Use $openclaw-napm-alert-query for alert event questions.

    OpenClaw owns:
    - natural-language understanding
    - time range resolution
    - follow-up inheritance
    - clarification policy
    - cross-skill sequencing
    - final Chinese narration

    This skill owns:
    - alertQuery validation
    - alertsSummary / alertsSummaryTimeLine / alertsDetail / timeValues execution
    - alert event normalization
    - aggregation and narrationInput construction
    - reportData and packetHandoff construction

    Alert boundary:
    - 告警, 告警事件, 告警摘要, 告警详情, 告警时间线, 紧急告警, 重大告警, 轻微告警, alertsSummary, alertsSummaryTimeLine, alertsDetail -> this skill.
    - 普通指标查询, 排行, 均值, 趋势, 对象清单, 指标清单, 下钻 -> openclaw-napm-query.
    - 报告, Word, docx, PDF -> use this skill first only when fresh alert data is needed, then openclaw-napm-report.

    Critical cross-skill sequencing — "告警数据包" (alert packet):
    - When the user says "告警数据包", "分析告警的数据包", "告警 <eventId> 的数据包",
      "分析这个告警数据包 <eventId>", or any request that combines an alert event ID
      with packet analysis intent, OpenClaw MUST call THIS skill FIRST (mode=detail or
      mode=detail_with_timeseries) to obtain alert details and packetHandoff.
    - packetHandoff may contain:
        * Direct candidates (linkType=2 or IP-based) for immediate packet download
        * Indirect discovery candidates (business/app/group alerts where the skill
          automatically finds suspicious IP conversations via topValues)
    - Only AFTER receiving the packetHandoff result should OpenClaw call
      openclaw-napm-packet-analysis. Use each candidate's suggestedPacketQuery directly —
      pass its mode and criteria as-is to the packet skill. Do NOT change the mode or
      construct a different packet query from scratch. The suggestedPacketQuery is the
      authoritative handoff contract between this skill and packet-analysis.
    - When packetHandoff contains indirect discovery candidates, OpenClaw MUST:
        1. Display the discovery summary to the user:
           "告警 <eventId> 为<类型>告警(<group>)，间接发现 Top5 嫌疑 IP 会话："
        2. List ALL candidates with rank, IP(s), and metric values BEFORE downloading
        3. Call packet-analysis for EACH candidate one by one (or let the user pick)
        4. Present each candidate's analysis result individually
      Do NOT silently download all candidates and merge them into one result.
    - If packetHandoff is null or has available=false, STOP. Do NOT call
      openclaw-napm-packet-analysis directly as a fallback. The null result IS the answer:
      this alert has no associated packet data and indirect discovery found no candidates.
      Tell the user: "该告警无可关联的数据包" and explain why (e.g. not a business/app/group
      alert, no discoverable IP conversations, or the alert category is not supported by
      indirect packet discovery).
    - The packet skill's "数据包 -> packet-analysis" rule does NOT override this.
      "告警数据包" means "alert detail FIRST, then packet", not "packet directly".
    - If the user already has alert detail context from a previous turn, OpenClaw may
      skip re-querying alert detail and use the existing packetHandoff directly.
    - 数据包, 报文, 抓包, pcap/cap, packetsDown, packetsPreview, DownServlet
      (WITHOUT alert event ID context) -> openclaw-napm-packet-analysis.

    This skill is read-only. Do not add, update, delete, enable, disable, or submit alert definitions or notification actions.

policy:
  allow_implicit_invocation: true

